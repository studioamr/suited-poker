<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIXTH · Poker</title>
<meta name="description" content="SIXTH: Texas Hold'em with 9 seats. private tables, Sit & Go tournaments and six cities to climb. play free.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#58bc89;--gb:#2bd47d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font:500 16px/1.4 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(900px 380px at 50% -8%,rgba(88,188,137,.32),rgba(88,188,137,.06) 45%,transparent 70%);pointer-events:none}
.top{position:relative;z-index:2;max-width:430px;margin:0 auto;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{display:flex;align-items:center;gap:9px;font:700 18px Unbounded;letter-spacing:.12em}
.eye{width:26px;height:26px;filter:drop-shadow(0 0 10px rgba(43,212,125,.6))}
.pill{font-size:13px;font-weight:700;color:var(--g);background:rgba(88,188,137,.1);border:1px solid rgba(88,188,137,.35);padding:5px 12px;border-radius:999px;transition:background .2s}
.pill:hover{background:rgba(88,188,137,.18)}
.stage{position:relative;z-index:1;height:calc(100% - 76px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 40px}
.row{display:flex;align-items:center;gap:18px}
.lead{font-size:clamp(26px,3.4vw,34px);font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.tick{position:relative;height:280px;width:clamp(230px,30vw,300px);overflow:hidden;-webkit-mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.rail{position:absolute;left:0;top:0;transition:transform .7s cubic-bezier(.65,0,.35,1)}
.it{height:56px;display:flex;align-items:center;gap:12px;font-size:clamp(24px,3vw,31px);font-weight:600;letter-spacing:-.02em;color:rgba(255,255,255,.28);transition:color .5s,opacity .5s;white-space:nowrap}
.it.on{color:#fff}
.mini{display:flex;flex:none}.mini span{width:20px;height:28px;border-radius:4px;background:#fff;color:#111;font:700 11px Manrope;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 3px;box-shadow:0 4px 10px rgba(0,0,0,.4)}.mini span+span{margin-left:-8px;transform:rotate(8deg)}
.mini span.r{color:#e11d48}.it:not(.on) .mini{opacity:.35}
.sub{margin-top:34px;font-size:15px;color:rgba(255,255,255,.85)}.sub b{font-weight:800;color:#fff}
.btns{display:flex;flex-direction:column;gap:12px;width:min(400px,100%);margin-top:18px}
.btn{height:50px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,box-shadow .3s}
.btn:hover{box-shadow:0 10px 40px rgba(255,255,255,.18)}.btn:active{transform:scale(.985)}.btn svg{width:18px;height:18px}
.alt{margin-top:18px;font-size:14px;color:rgba(255,255,255,.7)}.alt a{color:#fff;font-weight:800}
.foot{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.3);z-index:2}
@media (max-width:640px){.row{flex-direction:column;gap:6px}.tick{height:230px;width:250px}.lead{font-size:26px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <radialGradient id="eg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d9ffe9"/><stop offset=".45" stop-color="#2bd47d"/><stop offset="1" stop-color="#0b5a33"/></radialGradient>
 <symbol id="eye" viewBox="0 0 32 32"><path d="M2 16C6 8.5 11 5 16 5s10 3.5 14 11c-4 7.5-9 11-14 11S6 23.5 2 16z" fill="none" stroke="#2bd47d" stroke-width="1.8"/><circle cx="16" cy="16" r="6.2" fill="url(#eg)"/><path d="M16 11.2l1.3 3.5 3.5 1.3-3.5 1.3-1.3 3.5-1.3-3.5-3.5-1.3 3.5-1.3z" fill="#03130a"/></symbol>
</defs></svg>
<header class="top"><a class="logo" href="./"><svg class="eye"><use href="#eye"/></svg>SIXTH</a><a class="pill" href="app.html#tourneys">tournaments</a></header>
<main class="stage">
 <div class="row"><span class="lead">Win with</span><div class="tick"><div class="rail" id="rail"></div></div></div>
 <p class="sub">and Sit &amp; Go tournaments up to <b>1M coins</b>!</p>
 <div class="btns">
  <a class="btn" href="app.html"><svg viewBox="0 0 32 32"><use href="#eye"/></svg>Play free</a>
  <a class="btn" href="app.html#play"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Create a private table</a>
 </div>
 <p class="alt">Got a code? <a href="app.html#play">Join a table</a></p>
</main>
<div class="foot">texas hold'em · 9 seats · play coins have no cash value · 18+</div>
<script>
const H=[['Pocket Aces',[['A','♠'],['A','♥',1]]],['Royal Flush',[['K','♠'],['A','♠']]],['Full House',[['Q','♦',1],['Q','♣']]],['Four Kings',[['K','♥',1],['K','♦',1]]],['Big Bluffs',[['7','♣'],['2','♦',1]]],['Suited Connectors',[['9','♥',1],['10','♥',1]]],['The River',[['J','♠'],['J','♦',1]]]];
const L=[...H,...H,...H],rail=document.getElementById('rail');
rail.innerHTML=L.map(([n,c])=>`<div class="it"><span class="mini">${c.map(([r,s,red])=>`<span class="${red?'r':''}">${r}${s}&#xFE0E;</span>`).join('')}</span>${n}</div>`).join('');
const items=[...rail.children],ITEM=56;let i=H.length;
function go(anim=true){rail.style.transition=anim?'':'none';rail.style.transform=`translateY(${(rail.parentElement.clientHeight/2-ITEM/2)-i*ITEM}px)`;items.forEach((e,k)=>e.classList.toggle('on',k===i))}
go(false);setInterval(()=>{i++;go();if(i>=H.length*2){setTimeout(()=>{i-=H.length;go(false)},750)}},1800);
addEventListener('resize',()=>go(false));
</script>
</body>
</html>
